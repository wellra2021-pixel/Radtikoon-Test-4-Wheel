<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Lucky Wheels ปาร์ตี้ปีใหม่</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #9b51e0;
            --card-bg: #ffffff;
            --btn-green: #27ae60;
            --btn-yellow: #f1c40f;
            --btn-purple: #8e44ad;
            --summary-bg: #e8daef; /* สีพื้นหลังส่วนสรุป */
        }
        body { font-family: 'Kanit', sans-serif; background: linear-gradient(135deg, var(--primary-bg), #6c3483); color: #333; margin: 0; padding: 20px; min-height: 100vh; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 5px; }
        .header p { font-size: 1rem; opacity: 0.9; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 25px; font-size: 1rem; font-family: inherit; cursor: pointer; color: white; font-weight: 600; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .btn-green { background-color: var(--btn-green); }
        .btn-yellow { background-color: var(--btn-yellow); color: #333; }
        .btn-purple { background-color: var(--btn-purple); width: 100%; margin-top: 15px; }
        
        .wheels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .wheel-container { position: relative; width: 200px; height: 200px; margin: 0 auto 15px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, #ff9a9e 0deg 10deg, #fecfef 10deg 20deg, #a1c4fd 20deg 30deg, #c2e9fb 30deg 40deg, #f6d365 40deg 50deg, #fda085 50deg 60deg); border: 3px solid #eee; transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); }
        .pointer { position: absolute; top: 50%; right: -15px; transform: translateY(-50%); width: 0; height: 0; border-top: 15px solid transparent; border-bottom: 15px solid transparent; border-right: 20px solid #e74c3c; z-index: 10; }
        .center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .winner-name { font-weight: 600; color: #333; min-height: 24px; }
        
        /* ส่วนสรุปผลด้านล่าง */
        .summary-section { background: var(--summary-bg); border-radius: 15px; padding: 30px; max-width: 1200px; margin: 40px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .summary-title { text-align: center; color: var(--primary-bg); font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; }
        .summary-card { background: white; border-radius: 10px; padding: 15px 10px; text-align: center; box-shadow: 0 5px 10px rgba(0,0,0,0.1); }
        .summary-img-container { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; cursor: pointer; transition: transform 0.2s; }
        .summary-img-container:hover { transform: scale(1.05); }
        .summary-img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; border: 3px solid #f1c40f; }
        .summary-search-icon { position: absolute; bottom: -5px; right: -5px; background: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Modal Popup */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-img { width: 150px; height: 150px; border-radius: 15px; object-fit: cover; border: 4px solid var(--primary-bg); margin-bottom: 10px; }
        #status-msg { color: #f1c40f; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="header">
        <h1>🎉 8 Lucky Wheels ปาร์ตี้ปีใหม่ 🎉</h1>
        <p>เชื่อมต่อรายชื่อและรูปภาพจาก Google Sheet เรียบร้อยแล้ว</p>
        <p id="status-msg">กำลังโหลดข้อมูลรายชื่อ...</p>
        <div class="controls">
            <button class="btn btn-green" onclick="spinAll()">🔄 สุ่มทั้งหมดพร้อมกัน</button>
            <button class="btn btn-yellow" onclick="scrollToSummary()">🏆 ดูสรุปผู้โชคดีทั้ง 8 คน</button>
        </div>
    </header>

    <!-- พื้นที่วงล้อทั้ง 8 -->
    <main class="wheels-grid" id="wheels-container"></main>

    <!-- พื้นที่สรุปรายชื่อด้านล่าง -->
    <div class="summary-section" id="summary-section">
        <div class="summary-title">🏆 สรุปรายชื่อผู้โชคดี 🏆</div>
        <div class="summary-grid" id="summary-container"></div>
    </div>

    <!-- Popup ขยายรูปภาพ -->
    <div class="modal-overlay" id="winnerModal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">ผู้เข้าแข่งขันเล่นเกมส์</h3>
            <img src="" alt="Winner" class="modal-img" id="modal-img" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <div style="color: var(--primary-bg); font-size: 0.8rem; margin-bottom: 10px;">🔍 คลิกที่รูปเพื่อดูภาพขนาดใหญ่</div>
            <h2 id="modal-name" style="margin: 10px 0;">ชื่อผู้โชคดี</h2>
            <p style="color: #e74c3c; font-weight: bold;">ยินดีด้วยครับ/ค่ะ! 🎉</p>
            <button class="btn btn-purple" onclick="closeModal()" style="width: 100px;">ปิด</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. นำลิงก์ CSV จาก Google Sheet มาวางที่นี่
        // ==========================================
        const SHEET_CSV_URL = "วางลิงก์_CSV_ที่นี่"; 
        
        let participants = [];
        let winnersData = Array(8).fill(null); // เก็บข้อมูลคนชนะแต่ละวงล้อ
        
        const wheelsContainer = document.getElementById('wheels-container');
        const summaryContainer = document.getElementById('summary-container');
        let wheels = [];

        // สร้างวงล้อ 8 วง และ การ์ดสรุป 8 ใบ
        for (let i = 1; i <= 8; i++) {
            // สร้างการ์ดวงล้อ
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div style="margin-bottom: 10px; color: #666; font-size: 0.9rem;">⚪ วงล้อที่ ${i}</div>
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <div class="wheel" id="wheel-${i}"></div>
                    <div class="center-text">WIN</div>
                </div>
                <div class="winner-name" id="winner-${i}">- รอการสุ่ม -</div>
                <button class="btn btn-purple" onclick="spinWheel(${i})">หมุนวงล้อที่ ${i}</button>
            `;
            wheelsContainer.appendChild(card);
            wheels.push({ id: i, rotation: 0 });

            // สร้างการ์ดสรุปด้านล่าง
            const sumCard = document.createElement('div');
            sumCard.className = 'summary-card';
            sumCard.innerHTML = `
                <div style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">วงล้อที่ ${i}</div>
                <div class="summary-img-container" onclick="openPopupFromSummary(${i})">
                    <img src="https://via.placeholder.com/100?text=Wait" class="summary-img" id="sum-img-${i}">
                    <div class="summary-search-icon">🔍</div>
                </div>
                <div id="sum-name-${i}" style="font-weight: bold; font-size: 0.9rem;">-</div>
                <div style="font-size: 0.8rem; color: #e74c3c;">รอผลสุ่ม</div>
            `;
            summaryContainer.appendChild(sumCard);
        }

        // โหลดข้อมูลจาก Google Sheet CSV
        async function loadSheetData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/);
                
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].split(',');
                    if (row.length >= 2 && row[0].trim() !== '') {
                        participants.push({
                            name: row[0].trim(),
                            image: row[1].trim()
                        });
                    }
                }
                document.getElementById('status-msg').innerText = `✅ โหลดรายชื่อสำเร็จทั้งหมด ${participants.length} คน พร้อมสุ่มแล้ว!`;
                document.getElementById('status-msg').style.color = '#2ecc71';
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status-msg').innerText = '❌ โปรดใส่ลิงก์ CSV ให้ถูกต้องในโค้ดบรรทัดที่ 95';
                document.getElementById('status-msg').style.color = '#e74c3c';
            }
        }

        if (SHEET_CSV_URL !== "วางลิงก์_CSV_ที่นี่") loadSheetData();

        function getRandomParticipant() {
            if (participants.length === 0) return { name: "ไม่มีข้อมูล", image: "" };
            // สุ่ม 1 คน
            return participants[Math.floor(Math.random() * participants.length)];
        }

        function spinWheel(index) {
            if (participants.length === 0) {
                alert("กรุณารอโหลดข้อมูล หรือตรวจสอบลิงก์ Google Sheet");
                return;
            }

            const wheelDiv = document.getElementById(`wheel-${index}`);
            const winnerText = document.getElementById(`winner-${index}`);
            
            const extraSpins = (Math.floor(Math.random() * 5) + 5) * 360; 
            const randomDegree = Math.floor(Math.random() * 360);
            wheels[index-1].rotation += extraSpins + randomDegree;
            wheelDiv.style.transform = `rotate(${wheels[index-1].rotation}deg)`;
            
            winnerText.innerText = "กำลังสุ่ม...";

            setTimeout(() => {
                const winner = getRandomParticipant();
                // บันทึกข้อมูลคนชนะของวงล้อนี้ไว้
                winnersData[index-1] = winner;
                
                winnerText.innerHTML = `🎉 ${winner.name}`;
                
                // อัปเดตตารางสรุปด้านล่าง
                document.getElementById(`sum-img-${index}`).src = winner.image;
                document.getElementById(`sum-name-${index}`).innerText = winner.name;
                
                // โชว์ Popup ทันทีที่สุ่มเสร็จ
                showModal(index, winner.name, winner.image);
            }, 3000);
        }

        function spinAll() {
            for (let i = 1; i <= 8; i++) spinWheel(i);
        }

        // ฟังก์ชันเปิด Popup จากการคลิกรูปในตารางสรุป
        function openPopupFromSummary(index) {
            const winner = winnersData[index-1];
            if (winner) {
                showModal(index, winner.name, winner.image);
            } else {
                alert("วงล้อที่ " + index + " ยังไม่ได้ทำการสุ่มครับ!");
            }
        }

        // ฟังก์ชันแสดง Modal Popup
        function showModal(wheelIndex, name, imageUrl) {
            document.getElementById('modal-title').innerText = `วงล้อที่ ${wheelIndex} ผู้ชนะเลิศ!`;
            document.getElementById('modal-name').innerText = name;
            document.getElementById('modal-img').src = imageUrl;
            document.getElementById('winnerModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('winnerModal').style.display = 'none';
        }

        // ปุ่มเลื่อนลงไปดูสรุปผล
        function scrollToSummary() {
            document.getElementById('summary-section').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
